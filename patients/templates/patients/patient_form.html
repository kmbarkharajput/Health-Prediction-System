{% extends 'patients/base.html' %}
{% comment %} <form method="POST">
    {% csrf_token %}

    {% comment %} <input type="text" name="full_name" class="form-control">
    <input type="email" name="email" class="form-control mt-2">
    <input type="number" name="glucose" class="form-control mt-2">
    <input type="number" name="haemoglobin" class="form-control mt-2">
    <input type="number" name="cholesterol" class="form-control mt-2"> 

    <input type="text" name="full_name">
    <input type="email" name="email" >
    <input type="number" name="glucose" >
    <input type="number" name="haemoglobin" >
    <input type="number" name="cholesterol" >

    <button type="submit">Save</button>
</form> {% endcomment %}




{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card">

            <div class="card-header bg-primary text-white">
                <h3>{{ title }}</h3>
            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label>Full Name</label>
                        {{ form.full_name }}
                    </div>

                    <div class="mb-3">
                        <label>Date of Birth</label>
                        {{ form.dob }}
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        {{ form.email }}
                    </div>

                    <div class="mb-3">
                        <label>Glucose</label>
                        {{ form.glucose }}
                    </div>

                    <div class="mb-3">
                        <label>Haemoglobin</label>
                        {{ form.haemoglobin }}
                    </div>

                    <div class="mb-3">
                        <label>Cholesterol</label>
                        {{ form.cholesterol }}
                    </div>

                    <button type="submit"
                            class="btn btn-success">
                        Save Patient
                    </button>

                    <a href="{% url 'patient_list' %}"
                       class="btn btn-secondary">
                        Back
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
